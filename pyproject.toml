[project]
name = "phonetic-search-eval"
version = "1.0.0"
description = "Avaliação de algoritmos fonéticos de busca sobre os logradouros históricos da Pauliceia"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # o Elasticsearch é fixado na linha 7.x: o experimento roda contra o ES 7.3.0,
    # única versão para a qual existe build do plugin elasticsearch-analysis-metaphone_ptBR.
    "elasticsearch>=7.0.0,<8.0.0",
    "matplotlib>=3.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.14", "ty>=0.0.1a21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonetic_search", "src/pauliceia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 'pythonpath' deixa 'pytest' funcionar mesmo sem o pacote instalado, para quem
# clonar e rodar sem 'uv sync'. com 'uv sync' o pacote é instalado em modo
# editável e o import já funcionaria de qualquer forma.
pythonpath = ["src"]

[tool.ruff]
line-length = 120

# mesmas regras de lint do FastAPI (fastapi/fastapi, pyproject.toml).
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ty.terminal]
error-on-warning = true
